<!DOCTYPE html>
<html>
<head>
    <title>Photo Table</title>
</head>
<body>

    <h3>Photo Table</h3>

    <table border="1">
        <tr>
            <td><img src="frogg.png" alt="frog"></td>
            <td><img src="tree.png" alt="tree"></td>
            <td><img src="scenary.png" alt="scenary"></td>
        </tr>
        <tr>
            <td><h2>This is H2 tag...</h2></td>
            <td><button>Click Here</button></td>
            <td><img src="cameraman.png" alt="cameraman"></td>
        </tr>
        <tr>
            <td colspan="3">THANK YOU!!!</td>
        </tr>
    </table>

</body>
</html>
